services:
  api:
    image: ghcr.io/${GHCR_OWNER}/mini-evvy-api:latest
    env_file: .env
    expose:
      - "8080"
    mem_limit: 256m
    restart: unless-stopped

  worker:
    image: ghcr.io/${GHCR_OWNER}/mini-evvy-worker:latest
    env_file: .env
    mem_limit: 128m
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER}/mini-evvy-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      - api

  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma:/app/data
    ports:
      - "3001:3001"
    mem_limit: 128m
    restart: unless-stopped

volumes:
  uptime-kuma:
