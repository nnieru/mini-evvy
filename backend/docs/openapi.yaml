openapi: 3.0.3
info:
  title: mini-evvy API
  description: |
    Event seating, bookings, payments, attendance, and background jobs.

  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Events
  - name: Categories
  - name: Seats
  - name: Guests
  - name: Bookings
  - name: Payments
  - name: Attendance
  - name: Jobs

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [Users]
      summary: Current user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/events:
    get:
      tags: [Events]
      summary: List my events across organizations
      description: Returns events from all organizations where the user is a member.
      operationId: listMyEvents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyEventListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs:
    post:
      tags: [Organizations]
      summary: Create organization
      description: Allowed for users with no memberships or at least one owner/admin role. Member-only users receive 403.
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Organizations]
      summary: List my organizations
      operationId: listOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orgs/{orgId}:
    get:
      tags: [Organizations]
      summary: Get organization
      operationId: getOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orgs/{orgId}/my-role:
    get:
      tags: [Organizations]
      summary: Get current user's role in organization
      operationId: getMyRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRoleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /orgs/{orgId}/members:
    post:
      tags: [Organizations]
      summary: Add member
      description: Requires org owner or admin. Role is `admin` or `member`.
      operationId: addMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Organizations]
      summary: List members
      operationId: listMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /orgs/{orgId}/events:
    post:
      tags: [Events]
      summary: Create event
      operationId: createEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Events]
      summary: List events in organization
      operationId: listEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get event
      operationId: getEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
    patch:
      tags: [Events]
      summary: Update event
      operationId: updateEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/import-config:
    post:
      tags: [Events]
      summary: Import event configuration from another event
      description: |
        Owner/admin on both source and target events. Copies seat categories, seat layout,
        and/or invitation email template. Does not copy guests, bookings, or barcodes.
        Target must have no seat categories or seats when importing categories or seats.
      operationId: importEventConfig
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportEventConfigRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportEventConfigEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "409":
          description: Target event already has seat categories or seats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /events/{eventId}/finalize-seating:
    post:
      tags: [Jobs]
      summary: Enqueue finalize seating job
      description: |
        Owner/admin. Draft path only — does not affect manual bookings on the Bookings page.
        Event must be in seating_phase `open`, `preview`, or `approved`.
        Enqueues a job that assigns unbooked uploaded guests to draft items and holds seats (`held`).
        Seats are not assigned until this job runs. When it completes, phase becomes `preview`.
        Poll job status; review via seating-preview, then approve or reject the draft.
      operationId: finalizeSeating
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobIdEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "409":
          description: Finalize already in progress, seating not open, or no available seats in required categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /events/{eventId}/seating-readiness:
    get:
      tags: [Jobs]
      summary: Seating generate readiness
      description: |
        Owner/admin. Reports how many ticket slots unbooked guests still need and whether any
        available seats exist in those guests' categories (same rules as the finalize worker).
        Use before enqueueing finalize seating.
      operationId: getSeatingReadiness
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingReadinessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/seating-preview:
    get:
      tags: [Jobs]
      summary: Seating preview report
      description: Owner/admin. Requires an open seating draft. Lists draft seat assignments.
      operationId: getSeatingPreview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/searchQ"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSeatingPreviewListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/seating-preview/export:
    get:
      tags: [Jobs]
      summary: Export seating preview to Excel
      description: Owner/admin. Requires an open seating draft. Exports all draft rows matching optional `q` (ignores pagination).
      operationId: exportSeatingPreview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/searchQ"
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/seating-approve:
    post:
      tags: [Jobs]
      summary: Approve seating draft
      description: |
        Owner/admin. Draft path only. Phase must be `preview` with an open seating draft.
        Commits draft items to `seat_bookings`, enqueues send_invitation for each new booking,
        and sets phase `approved`. Does not modify existing manual bookings.
      operationId: approveSeating
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/seating-reject:
    post:
      tags: [Jobs]
      summary: Reject seating draft
      description: |
        Owner/admin. Draft path only. Requires an open seating draft.
        Releases held seats from draft items, deletes draft items, and soft-deletes unbooked guests
        (guests with active manual or approved-wave bookings are kept). Does not cancel existing
        `seat_bookings` or change manually assigned seats. Marks draft rejected. Phase becomes
        `open` or stays `approved` if a prior wave was approved.
      operationId: rejectSeating
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/seating-draft/items/{itemId}:
    patch:
      tags: [Jobs]
      summary: Reassign draft item seat
      description: Owner/admin. Requires an open seating draft. Swaps held seat for another available seat in the same category.
      operationId: reassignDraftItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat_id]
              properties:
                seat_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Draft item or seat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Seat not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /events/{eventId}/jobs:
    get:
      tags: [Jobs]
      summary: List jobs for event
      description: Owner/admin. Ordered by created_at DESC.
      operationId: listEventJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/searchQ"
        - name: type
          in: query
          schema:
            type: string
            enum: [finalize_seating, send_invitation]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_process, done, failed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedJobListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/jobs/invitation-emails/export:
    get:
      tags: [Jobs]
      summary: Export invitation email jobs
      description: Owner/admin. Excel report of send_invitation jobs with guest, seat, and ticket details.
      operationId: exportInvitationEmails
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/searchQ"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_process, done, failed]
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/email-template/invitation:
    get:
      tags: [EmailTemplates]
      summary: Get invitation email template
      description: Owner/admin. Returns saved config or system defaults.
      operationId: getInvitationEmailTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEmailTemplateEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
    put:
      tags: [EmailTemplates]
      summary: Save invitation email template
      description: Owner/admin.
      operationId: upsertInvitationEmailTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationEmailTemplate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEmailTemplateEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
    delete:
      tags: [EmailTemplates]
      summary: Reset invitation email template
      description: Owner/admin. Deletes custom template so system default is used.
      operationId: resetInvitationEmailTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/email-template/invitation/preview:
    post:
      tags: [EmailTemplates]
      summary: Preview invitation email
      description: Owner/admin. Optional body uses draft config; otherwise saved/default.
      operationId: previewInvitationEmailTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationEmailTemplate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEmailPreviewEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/email-template/invitation/test-send:
    post:
      tags: [EmailTemplates]
      summary: Send test invitation email
      description: Owner/admin. Sends sample email to current user (rate limited).
      operationId: testSendInvitationEmailTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationEmailTemplate"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "429":
          description: Rate limited

  /events/{eventId}/email-template/invitation/banner:
    post:
      tags: [EmailTemplates]
      summary: Upload invitation banner image
      description: Owner/admin. Stores image on server; returns public URL for banner_image_url.
      operationId: uploadInvitationEmailBanner
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerUploadEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Get job by ID
      description: Owner/admin (via event_id in job data).
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/JobNotFound"

  /events/{eventId}/categories:
    post:
      tags: [Categories]
      summary: Create seat category
      operationId: createCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Categories]
      summary: List categories
      operationId: listCategories
      security:
        - bearerAuth: []
