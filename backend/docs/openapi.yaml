        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Seats]
      summary: List seats
      operationId: listSeats
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, held, reserved, occupied, blocked]
          description: Filter seats by status.
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter seats by ticket category.
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/searchQ"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSeatListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /seats/{seatId}:
    get:
      tags: [Seats]
      summary: Get seat
      operationId: getSeat
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/seatId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SeatNotFound"
    patch:
      tags: [Seats]
      summary: Update seat
      operationId: updateSeat
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/seatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SeatNotFound"

  /events/{eventId}/guests:
    post:
      tags: [Guests]
      summary: Create guest
      description: Org member. Event seating must be editable (not in preview/approved).
      operationId: createGuest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Guests]
      summary: List guests
      operationId: listGuests
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/searchQ"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGuestListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /events/{eventId}/guests/unbooked-count:
    get:
      tags: [Guests]
      summary: Count guests needing seats
      description: |
        Org member. Returns guests with fewer active bookings than `ticket_count` — the same
        eligibility set used by finalize seating.
      operationId: getUnbookedGuestCount
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnbookedGuestCountEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/EventNotFound"

  /events/{eventId}/guests/import:
    post:
      tags: [Guests]
      summary: Import guests from Excel
      description: |
        Owner/admin. Upload Nadaland-style `.xlsx` with columns Name, Email, Invoice Code,
        Order Time, Ticket Name, Ticket Quantity, Status. Ticket Name maps to category code.
        PAID rows set paid_date from Order Time. Duplicate name+email+category bumps ticket_count.
        When seating phase is `approved` (after a prior wave), rows matching an existing guest who
        already has a booking for every ticket are skipped. To add more tickets for that guest,
        edit ticket count on the Guests page first.
      operationId: importGuests
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestImportResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Seating locked for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /guests/{guestId}:
    get:
      tags: [Guests]
      summary: Get guest
      operationId: getGuest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/guestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/GuestNotFound"
    patch:
      tags: [Guests]
      summary: Update guest
      description: Org member. Event seating must be editable (not in preview/approved).
      operationId: updateGuest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/guestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGuestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/GuestNotFound"

  /events/{eventId}/bookings:
    post:
      tags: [Bookings]
      summary: Create booking (manual seat assignment)
      description: |
        Org member. Manual booking path — separate from the seating draft flow.
        Creates a booking for an available seat immediately from the request body.
        Blocked while a seating draft is open (`seating_phase` `preview`).

        Provide either an existing `guest_id` (legacy) or inline guest fields
        (`name`, `email`, `category_id`) to create the guest and booking in one
        transaction. Inline guest bookings use `source=invited` and `ticket_count=1`.
      operationId: createBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Seat not available or category mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [Bookings]
      summary: List bookings
      description: |
        Org member. Returns active bookings only (cancelled excluded). Optional
        `payment_status` filter and pagination via `page` / `page_size`.
      operationId: listBookings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: payment_status
          in: query
          schema:
            type: string
            enum: [all, paid, unpaid]
            default: all
        - $ref: "#/components/parameters/searchQ"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBookingListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /events/{eventId}/bookings/batch:
    post:
      tags: [Bookings]
      summary: Create bookings in batch (seat grid)
      description: |
        Org member. Manual booking path — separate from the seating draft flow.
        Creates one guest and one booking per item in a single transaction from user input.
        Blocked while a seating draft is open (`seating_phase` `preview`).
        All seats must be available, belong to the event, and share the same category.
        Guest category is taken from each seat's category_id.
      operationId: createBookingsBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBatchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Seat not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: Get booking
      operationId: getBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
    patch:
      tags: [Bookings]
      summary: Update booking status
      description: |
        Org member. Transitions: pending→not_paid|paid|cancelled; not_paid→paid|cancelled; paid→not_paid|cancelled (not_paid frees paid hold to reserved).
        paid sets seat occupied; cancelled releases seat to available.
      operationId: updateBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
    delete:
      tags: [Bookings]
      summary: Soft-delete booking
      description: Org member. Cancels if needed, releases seat, sets deleted_at.
      operationId: deleteBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      responses:
        "204":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"

  /bookings/{bookingId}/resend-invitation:
    post:
      tags: [Bookings]
      summary: Re-send invitation email
      description: Org member. Event seating must be approved. Booking must not be cancelled; guest must have email.
      operationId: resendInvitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobIdEnvelope"
        "400":
          description: Guest email missing or booking not resendable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: Seating not approved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /bookings/{bookingId}/payments:
    post:
      tags: [Payments]
      summary: Create payment
      description: |
        Org member. status `success` on pending/not_paid booking marks booking paid,
        seat occupied, and sets guest.paid_date when null.
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: Booking not payable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [Payments]
      summary: List payments for booking
      operationId: listPayments
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/bookingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"

  /events/{eventId}/attendance:
    post:
      tags: [Attendance]
      summary: Check in guest
      description: |
        Org member. Provide either `barcode` OR both `guest_id` and `seat_id`.
        Requires paid booking. Sets status checked_in.
      operationId: createAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttendanceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Guest, seat, or paid booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [Attendance]
      summary: List attendance logs
      operationId: listAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/eventId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/searchQ"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAttendanceListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /attendance/{attendanceId}:
    get:
      tags: [Attendance]
      summary: Get attendance log
      operationId: getAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/attendanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AttendanceNotFound"
    patch:
      tags: [Attendance]
      summary: Update attendance (undo check-in)
      description: Org member. Only transition checked_in → not_checked_in.
      operationId: updateAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/attendanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AttendanceNotFound"
    delete:
      tags: [Attendance]
      summary: Soft-delete attendance log
      operationId: deleteAttendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/attendanceId"
      responses:
        "204":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AttendanceNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from login/register. Subject is user UUID.

  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    seatId:
      name: seatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    guestId:
      name: guestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    attendanceId:
      name: attendanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    searchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive search across list-specific fields.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EventNotFound:
      description: Event not found
      content:
        application/json:
